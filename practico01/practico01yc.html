<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>practico01</title>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<div id="app">

    <h3>Post</h3>

    <p v-if="post">
        ID: {{ post.id }} <br>
        Título: {{ post.title }}
    </p>

    <h3>Comentarios</h3>

    <ul>
        <li v-for="comentario in comentarios">
            Nombre: {{ comentario.name }} <br>
            Email: {{ comentario.email }}
        </li>
    </ul>

</div>

<script>

var app = new Vue({

    el: "#app",

    data: {
        post: null,
        comentarios: []
    },

    mounted: function() {

        this.mostrarPost();
        this.mostrarComments();

    },

    methods: {

        obtenerPost(postId) {

            return axios.get('https://jsonplaceholder.typicode.com/posts/' + postId)
                .then(function(response) {

                    return response.data;

                })
                .catch(error => {

                    console.error(error);

                });
        },


        obtenerComments(postId) {

            return axios.get('https://jsonplaceholder.typicode.com/posts/' + postId + '/comments')
                .then(function(response) {

                    return response.data;

                })
                .catch(error => {

                    console.error(error);

                });
        },


        mostrarPost() {

            var that = this;

            this.obtenerPost(1)
                .then(function(post) {

                    that.post = post;

                });
        },


        mostrarComments() {

            var that = this;

            this.obtenerComments(1)
                .then(function(comentarios) {

                    that.comentarios = comentarios;

                });
        }

    }

});



</script>

</body>
