<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>practico01</title>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
</head>
<body>
<div id="app">
    <button @click="contador++">Incrementar</button>
    <p>contador: {{contador}} </p>
    <button @click="contador--" >decrementar</button>
</div>

    <script>
    var app = new Vue({ 
        el : '#app',
        data: {
            contador:0
        }

    })

</script>

</body>
