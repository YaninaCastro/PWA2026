<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>practico01</title>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<div id="app">

    <h3>Posts</h3>

    <ul>
        <li v-for="post in posts" @click="mostrarComments(post.id)">
            ID: {{ post.id }} <br>
            Título: {{ post.title }}
        </li>
    </ul>

    <h3>Comentarios</h3>

    <ul>
        <li v-for="comentario in comentarios">
            Nombre: {{ comentario.name }} <br>
            Email: {{ comentario.email }} <br>
            Comentario: {{ comentario.body }}
        </li>
    </ul>

</div>

<script>

var app = new Vue({

    el: "#app",

    data: {
        posts: [],
        comentarios: []
    },

    mounted: function() {

        var that = this;

        for (var i = 1; i <= 10; i++) {

            this.obtenerPost(i)
                .then(function(post) {

                    that.posts.push(post);

                });

        }

    },

    methods: {

        obtenerPost(postId) {

            return axios.get('https://jsonplaceholder.typicode.com/posts/' + postId)
                .then(function(response) {

                    return response.data;

                })
                .catch(error => {

                    console.error(error);

                });
        },


        obtenerComments(postId) {

            return axios.get('https://jsonplaceholder.typicode.com/posts/' + postId + '/comments')
                .then(function(response) {

                    return response.data;

                })
                .catch(error => {

                    console.error(error);

                });
        },


        mostrarComments(postId) {

            var that = this;

            this.obtenerComments(postId)
                .then(function(comentarios) {

                    that.comentarios = comentarios;

                });

        }

    }

});



</script>

</body>
